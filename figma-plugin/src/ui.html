<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 12px/1.5 Inter, system-ui, sans-serif; color: var(--figma-color-text, #1e1e1e); background: var(--figma-color-bg, #fff); }
  main { padding: 16px; display: grid; gap: 12px; }
  h1 { font-size: 13px; margin: 0; }
  .sub { color: var(--figma-color-text-secondary, #6b6b6b); display: block; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; display: block; overflow-wrap: anywhere; }
  label { display: grid; gap: 4px; font-weight: 500; }
  input[type=text], input[type=password] { font: inherit; padding: 6px 8px; border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 5px; background: var(--figma-color-bg, #fff); color: inherit; }
  details.settings { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 6px; padding: 8px 10px; }
  details.settings > div { display: grid; gap: 8px; margin-top: 8px; }
  summary { cursor: pointer; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border-radius: 6px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--figma-color-border, #e6e6e6); background: var(--figma-color-bg, #fff); color: inherit; }
  button.primary { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); border-color: transparent; }
  .status { margin: 0; color: var(--figma-color-text-secondary, #6b6b6b); }
  .status.error { color: var(--figma-color-text-danger, #dc3412); }
  .status.ok { color: var(--figma-color-text-success, #14ae5c); }
  details.group { border-top: 1px solid var(--figma-color-border, #e6e6e6); padding-top: 6px; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
  .hint { color: var(--figma-color-text-secondary, #6b6b6b); margin: 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 10px; background: none; color: var(--figma-color-text-secondary, #6b6b6b); }
  .tabs button[aria-selected=true] { color: inherit; border-bottom-color: var(--figma-color-border-brand-strong, #0d99ff); }
  [hidden] { display: none !important; }
  section { display: grid; gap: 12px; }
  h2 { font-size: 13px; margin: 0; }
  h3 { font-size: 12px; margin: 8px 0 0; }
  button:disabled { opacity: .45; cursor: default; }
  .stepper { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 0; padding: 0; color: var(--figma-color-text-tertiary, #b3b3b3); font-size: 11px; }
  .stepper .past { color: var(--figma-color-text-secondary, #6b6b6b); }
  .stepper .current { color: var(--figma-color-text, #1e1e1e); font-weight: 600; }
  .steps { display: grid; gap: 10px; margin-top: 10px; }
  .card, .callout { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 6px; padding: 10px; display: grid; gap: 4px; }
  .callout.error { border-color: var(--figma-color-border-danger, #f24822); }
  .callout p { margin: 0; }
  .between { justify-content: space-between; }
  .actions { margin-top: 4px; }
  .layer { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 6px; padding: 8px; display: grid; gap: 4px; }
  .layer.needs { border-color: var(--figma-color-border-warning, #ffc21a); }
  .muted { color: var(--figma-color-text-secondary, #6b6b6b); }
  .strong { font-weight: 600; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--figma-color-bg-secondary, #f5f5f5); white-space: nowrap; }
  .badge.kind-primitive, .badge.kind-raw { background: var(--figma-color-bg-warning-tertiary, #fff1c2); color: #6b4e00; }
  .badge.kind-semantic { background: var(--figma-color-bg-success-tertiary, #cff7d3); color: #0b5d2a; }
  .badge.kind-missing { background: var(--figma-color-bg-danger-tertiary, #ffe2e0); color: #9b1c0b; }
  .flag { font-size: 11px; color: #8a6400; }
  .pair { display: inline-flex; gap: 10px; }
  .mode { display: inline-flex; align-items: center; gap: 4px; }
  .mode-label { font-size: 11px; color: var(--figma-color-text-secondary, #6b6b6b); }
  .swatch { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid var(--figma-color-border, #e6e6e6); vertical-align: middle; font-size: 10px; flex: none;
    background: repeating-conic-gradient(#d9d9d9 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
  .swatch .fill { position: absolute; inset: 0; }
  .swatch.empty { background: none; border-style: dashed; color: var(--figma-color-text-secondary, #6b6b6b); }
  .cell { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .issue .who { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  .picker { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  select { font: inherit; padding: 4px 6px; border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 5px; background: var(--figma-color-bg, #fff); color: inherit; max-width: 150px; }
  .issues { gap: 4px; }
  .issue { display: flex; gap: 6px; align-items: baseline; }
  .issue.error .badge { background: var(--figma-color-bg-danger-tertiary, #ffe2e0); color: #9b1c0b; }
  .issue.warning .badge { background: var(--figma-color-bg-warning-tertiary, #fff1c2); color: #6b4e00; }
  .lead { margin: 0; font-size: 13px; }
  ul.plain { list-style: disc; padding-left: 18px; gap: 4px; }
  .ticks { gap: 8px; }
  .tick { display: flex; gap: 8px; align-items: flex-start; }
  .tick .mark { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; flex: none; background: var(--figma-color-bg-secondary, #f5f5f5); }
  .tick.done .mark { background: var(--figma-color-bg-success, #14ae5c); color: #fff; }
  .tick.failed .mark { background: var(--figma-color-bg-danger, #f24822); color: #fff; }
  .tick > div { display: grid; gap: 6px; }
  table.tokens { border-collapse: collapse; width: 100%; font-size: 11px; }
  table.tokens th, table.tokens td { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); vertical-align: middle; }
  pre.css { margin: 0; padding: 8px; border-radius: 6px; background: var(--figma-color-bg-secondary, #f5f5f5); font: 11px/1.45 ui-monospace, "SF Mono", Menlo, monospace; overflow-x: auto; white-space: pre; }
  /* Component scan, 3 screens (24 Nov 2026) */
  .scan-head { display: flex; justify-content: flex-end; }
  .pills { list-style: none; display: flex; gap: 6px; margin: 0; padding: 0; }
  .pills li { padding: 3px 10px; border-radius: 99px; background: var(--figma-color-bg-secondary, #f5f5f5); color: var(--figma-color-text-secondary, #6b6b6b); font-weight: 500; }
  .pills li.on { background: var(--figma-color-bg-inverse, #1e1e1e); color: var(--figma-color-text-oninverse, #fff); }
  .pills li.done { background: var(--figma-color-bg-success-tertiary, #cff7d3); color: #0b5d2a; }
  .scan-body { display: grid; gap: 14px; margin-top: 10px; }
  .scan-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--figma-color-border, #e6e6e6); padding-top: 12px; }
  .empty-state { border: 1px dashed var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 18px; display: grid; gap: 6px; }
  .pair-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
  .side { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
  .stage { border-radius: 6px; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 90px; align-items: center; }
  .stage.light { background: #ffffff; border: 1px solid #ececec; }
  .stage.dark { background: #1a1a1a; }
  .stage.dark .hint, .stage.dark .vlabel { color: #bdbdbd; }
  .vcol { display: grid; justify-items: center; gap: 4px; }
  .vcol img { height: 48px; width: auto; max-width: 120px; }
  .vlabel { font-size: 10.5px; color: #6b6b6b; }
  .noimg { font-size: 10px; color: #9b9b9b; }
  .field { display: grid; gap: 6px; }
  .name-row { align-items: flex-end; }
  .name-row input { width: 240px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 99px; padding: 2px 10px; font-weight: 500; }
  .state-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .state-pick { display: grid; gap: 6px; justify-items: center; border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 8px; background: #fff; }
  .state-pick img { height: 44px; width: auto; }
  .status.warn { color: #8a5d00; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 14px; align-items: start; }
  .map-wrap { overflow-x: auto; }
  table.map { border-collapse: separate; border-spacing: 6px; width: 100%; margin: -6px; table-layout: fixed; }
  table.map th:first-child, table.map td.part { width: 64px; }
  table.map th { text-align: left; font-size: 11px; color: var(--figma-color-text-secondary, #6b6b6b); font-weight: 600; padding: 0 4px; }
  table.map td.part { font-weight: 600; vertical-align: top; padding-top: 10px; white-space: nowrap; }
  table.map td { vertical-align: top; }
  button.cell { display: flex; flex-direction: column; align-items: stretch; white-space: normal; overflow: hidden; gap: 5px; text-align: left; width: 100%; min-width: 0; font-weight: 400; padding: 8px; border-radius: 6px; }
  button.cell.reused { background: var(--figma-color-bg-secondary, #f5f5f5); }
  button.cell.reused .tok { color: var(--figma-color-text-secondary, #6b6b6b); }
  button.cell.sel { outline: 2px solid var(--figma-color-border-brand-strong, #0d99ff); outline-offset: -1px; }
  button.cell.needs { border-color: var(--figma-color-border-warning, #ffc21a); }
  .tok { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; font-weight: 600; overflow-wrap: anywhere; }
  .ld { display: grid; gap: 3px; }
  .colour { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; min-width: 0; }
  .colour span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .was { font-size: 10.5px; color: var(--figma-color-text-secondary, #6b6b6b); overflow-wrap: anywhere; }
  button.cell > * { min-width: 0; }
  .nocell { font-size: 10.5px; color: var(--figma-color-text-tertiary, #b3b3b3); display: block; padding: 8px; }
  .detail { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 12px; display: grid; gap: 8px; position: sticky; top: 0; }
  .detail .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--figma-color-text-secondary, #6b6b6b); }
  .detail .hint.warn { color: #8a5d00; }
  .cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; align-items: center; }
  .cmp .h { font-size: 10.5px; color: var(--figma-color-text-secondary, #6b6b6b); }
  .cmp select { max-width: 100%; }
  .cmp .colour span:last-child { white-space: normal; overflow-wrap: anywhere; }
  .layer-part { display: grid; gap: 4px; font-weight: 400; }
  .layer-part select { max-width: 100%; }
  .fstep { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 12px; }
  .fstep .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--figma-color-bg-secondary, #f5f5f5); }
  .fstep.done .n { background: var(--figma-color-bg-success, #14ae5c); color: #fff; }
  .fstep .t { display: grid; gap: 2px; }
  .badge.ok { background: var(--figma-color-bg-success-tertiary, #cff7d3); color: #0b5d2a; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Token Library</h1>
    <span class="sub">File: <span id="file">this file</span></span>
  </div>
  <details class="settings" id="settings">
    <summary>Settings</summary>
    <div>
      <label>Sync key <input type="password" id="key" autocomplete="off" placeholder="Paste the key from Token Library"></label>
      <p class="hint">In Token Library, open Sync to Figma and push Make a sync key.</p>
      <label>Token Library address <input type="text" id="url" autocomplete="off"></label>
      <label class="row" style="display:flex;font-weight:400"><input type="checkbox" id="drafts"> Include draft tokens</label>
      <div class="row"><button id="save" type="button">Save settings</button></div>
    </div>
  </details>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-sync" aria-controls="panel-sync" aria-selected="true">Sync from tool</button>
    <button type="button" role="tab" id="tab-scan" aria-controls="panel-scan" aria-selected="false">Scan component</button>
  </div>
  <section id="panel-sync" role="tabpanel" aria-labelledby="tab-sync">
    <div class="row">
      <button class="primary" id="check" type="button">Check for changes</button>
      <button class="primary" id="sync" type="button" hidden>Sync</button>
    </div>
    <p class="status" id="status" role="status">Push Check for changes to compare Token Library with this file.</p>
    <div id="result"></div>
  </section>
  <section id="panel-scan" role="tabpanel" aria-labelledby="tab-scan" hidden></section>
</main>
<script>/*UI_SCRIPT*/</script>
</body>
</html>
